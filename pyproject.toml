[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accesscheck"
version = "0.1.0"
description = "Local-first website accessibility scanner and WCAG report dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1",
  "python-multipart>=0.0.9", "pydantic-settings>=2.4", "playwright>=1.47",
  "beautifulsoup4>=4.12", "lxml>=5.3", "wcag-contrast-ratio>=0.3",
  "sqlalchemy>=2.0", "aiosqlite>=0.20", "celery[redis]>=5.4", "redis>=5.0",
  "weasyprint>=62", "typer>=0.12", "certifi"
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]
[project.scripts]
accesscheck = "cli.main:app"

[tool.setuptools.packages.find]
include = ["app*", "cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
