[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accesscheck"
version = "2.0.2"
description = "Local-first website accessibility scanner and WCAG report dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "jinja2>=3.1,<4",
  "python-multipart>=0.0.18", "pydantic-settings>=2.4,<3", "playwright>=1.50,<2",
  "sqlalchemy>=2.0,<3", "aiosqlite>=0.20,<1", "httpx[socks]>=0.27,<1",
  "reportlab>=4.2,<5", "python-docx>=1.1,<2", "typer>=0.12,<1", "certifi"
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "pypdf>=5"]
[project.scripts]
accesscheck = "cli.main:app"

[tool.setuptools.packages.find]
include = ["app*", "cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
app = ["web/templates/*.html", "web/static/css/*.css", "web/static/js/*.js", "web/static/*.svg", "engine/*.js", "engine/vendor/*.js", "engine/vendor/*LICENSE*"]
